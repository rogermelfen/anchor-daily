# ============================================
# Anchor Daily - Daglig Push-varsling Cron
# ============================================
# Denne GitHub Actions-workflowen kjører hver dag kl. 07:00 UTC
# og kaller send-daily-push Edge Function i Supabase.
#
# Oppsett:
# 1. Gå til GitHub repo -> Settings -> Secrets and variables -> Actions
# 2. Legg til følgende secrets:
#    - SUPABASE_URL: Din Supabase prosjekt-URL (f.eks. https://abc.supabase.co)
#    - SUPABASE_SERVICE_ROLE_KEY: Din service role-nøkkel
#
# Du kan justere tidspunktet i cron-uttrykket nedenfor.
# Merk: GitHub Actions cron bruker UTC-tid.
# 07:00 UTC = 08:00 norsk vintertid / 09:00 norsk sommertid.

name: Daily Push Notifications

on:
  schedule:
    # Kjører kl. 07:00 UTC hver dag
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Tillater manuell kjøring fra GitHub UI for testing

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily push notifications
        run: |
          echo "Triggering daily push notifications..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/send-daily-push" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response code: $HTTP_CODE"
          echo "Response body: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Push notifications sent successfully!"
          else
            echo "Failed to send push notifications."
            exit 1
          fi
